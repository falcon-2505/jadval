<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><title>Jadval</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1d1b26;--mut:#6f6a80;--ln:#e6e2f0;--ac:#7c4dff;--on:#fff;
--hb:var(--ac);--hd:color-mix(in srgb,var(--ac) 12%,var(--card));--hdt:color-mix(in srgb,var(--ac) 70%,var(--tx));--sel:color-mix(in srgb,var(--ac) 16%,var(--card));--zb:color-mix(in srgb,var(--ac) 5%,var(--card));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#232030;--tx:#f3f0fa;--mut:#a29cb5;--ln:#38324a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141f;--card:#232030;--tx:#f3f0fa;--mut:#a29cb5;--ln:#38324a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--hb);color:var(--on);display:grid;place-items:center;font-weight:700}
h1{font-size:17px;margin:0;font-weight:650}.sp{flex:1}
.nav,.seg{display:flex;background:var(--hd);border-radius:10px;padding:3px;gap:2px}
.nav button,.seg button{border:0;background:none;color:var(--mut);padding:6px 13px;border-radius:8px;font-weight:600;cursor:pointer}
.nav button.on,.seg button.on{background:var(--card);color:var(--hdt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.bar button,.bar summary,.acts button{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;list-style:none}
.bar button:hover,.bar summary:hover,.acts button:hover{border-color:var(--ac)}
.pri{background:var(--hb)!important;border-color:var(--hb)!important;color:var(--on)!important;font-weight:600}
.dd{position:relative}.dd summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:34px;z-index:20;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px;display:flex;flex-direction:column;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.menu button{border:0;text-align:left;border-radius:6px}
.fx{display:flex;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;overflow:hidden}
.fx b{padding:7px 12px;color:var(--hdt);border-right:1px solid var(--ln);min-width:64px;text-align:center;font-size:13px}
.fx input{flex:1;border:0;background:none;color:var(--tx);padding:8px 10px;font:inherit;outline:0;min-width:0}
.sheet{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:auto;height:64vh}
table{border-collapse:collapse;table-layout:fixed;user-select:none;-webkit-user-select:none}
th,td{border:1px solid var(--ln);padding:0;height:var(--h,32px);position:relative}
.hr th{height:28px}
th{background:var(--hd);color:var(--hdt);font-weight:600;font-size:12px;position:sticky;top:0;z-index:2;cursor:pointer}
th.r{left:0;z-index:3}
td input{display:block;width:100%;height:calc(var(--h,32px) - 1px);border:0;background:none;color:var(--tx);padding:0 9px;font:inherit;outline:0;cursor:cell;text-overflow:ellipsis}
td.n input{text-align:right}
.s-zebra td,.s-zebra th,.s-lines td,.s-lines th{border-width:0 0 1px}
.s-zebra tr:nth-child(even) td{background:var(--zb)}
td.in{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--ac) 14%,transparent)}
td.sel{outline:2px solid var(--ac);outline-offset:-2px}
.cz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:5;touch-action:none}
.rz{position:absolute;left:0;bottom:-4px;width:100%;height:9px;cursor:row-resize;z-index:5;touch-action:none}
.cz:hover,.rz:hover{background:var(--ac);opacity:.5}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hb),color-mix(in srgb,var(--hb) 55%,#000));color:var(--on);border-radius:20px;padding:30px 26px;margin-bottom:16px}
.hero .wm{position:absolute;right:-8px;top:-12px;width:200px;height:200px;opacity:.15;fill:currentColor}
.hero h2{position:relative;margin:0 0 8px;font-size:26px;letter-spacing:-.3px}
.hero p{position:relative;margin:0 0 20px;opacity:.92;max-width:470px;line-height:1.5}
.hero button{position:relative;background:var(--on);color:var(--hb);border:0;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.tile i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--hd);color:var(--hdt);font-weight:700;margin-bottom:10px}
.tile b{display:block;margin-bottom:4px}.tile span{color:var(--mut);font-size:13px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:20px}
.card h3{margin:0 0 14px;font-size:17px}
.sec{padding:16px 0;border-top:1px solid var(--ln)}
.sec h4{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:600}
.sec .seg{display:inline-flex}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px}
.cl{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid transparent;border-radius:9px;padding:5px 7px;cursor:pointer;text-align:left;font-size:11px;min-width:0;min-height:29px;transition:border-color .2s,background .2s,box-shadow .2s,transform .2s}
.cl:hover{border-color:var(--ac);transform:translateY(-1px)}.cl.on{border-color:var(--ac);background:var(--hd);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 25%,transparent),0 0 12px color-mix(in srgb,var(--ac) 18%,transparent)}
.cl.on::after{content:"✓";margin-left:auto;color:var(--ac);font-weight:700}
.cl s{display:block;width:16px;height:16px;border-radius:5px;flex:none}
.cl input{width:17px;height:17px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.rg{display:flex;align-items:center;gap:10px}.rg input{flex:1;accent-color:var(--ac)}.rg b{min-width:34px;text-align:right}
#ov{position:fixed;inset:0;background:rgba(20,10,40,.4);display:flex;align-items:flex-start;justify-content:center;padding:8vh 12px;z-index:30}
#ov[hidden]{display:none}
.pn{background:var(--card);border:1px solid var(--ln);border-radius:14px;width:100%;max-width:540px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--hb);color:var(--on)}
.ph button{background:none;border:0;font-size:16px;cursor:pointer}
.ps{padding:8px 14px 0;color:var(--mut);font-size:12px}
#q{margin:8px 14px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
.cats{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.cats button{border:1px solid var(--ln);background:none;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12px}
.cats button.on{background:var(--hd);border-color:var(--ac);color:var(--hdt);font-weight:600}
.fl{overflow:auto;border-top:1px solid var(--ln)}
.fi{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--ln);cursor:pointer}
.fi:hover{background:var(--sel)}.fi b{color:var(--hdt);font-family:ui-monospace,Menlo,monospace}.fi span{color:var(--mut);text-align:right}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
td{vertical-align:middle}
.fbar{padding:6px;background:var(--card);border:1px solid var(--ln);border-radius:12px}
.ib{min-width:32px;height:30px;padding:0 8px!important;display:inline-grid;place-items:center}
.ib.on{background:var(--hd)!important;border-color:var(--ac)!important;color:var(--hdt)}
.gp{display:inline-flex;gap:2px}
.cg{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--mut)}
.cg input[type=color]{width:28px;height:28px;border:1px solid var(--ln);border-radius:6px;padding:1px;background:none;cursor:pointer}
.fbar select{height:30px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);padding:0 6px}
.shw{position:relative}
.wmk{position:absolute;left:1px;top:1px;pointer-events:none;z-index:6;border-radius:13px;overflow:hidden}
.pnl{gap:10px;min-width:280px;padding:12px}
.pnl input[type=text]{padding:7px 9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
.pnl .rg span{min-width:64px;font-size:12px;color:var(--mut)}
.pnl .seg button{flex:1}
.work{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:12px;align-items:start}
.work.noside{grid-template-columns:minmax(0,1fr)}.work.noside .side{display:none}
@media(max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}
.bar button.on{background:var(--hd);border-color:var(--ac);color:var(--hdt)}
.side{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:16px;max-height:calc(64vh + 80px);overflow:auto}
.side>div+div{border-top:1px solid var(--ln);padding-top:14px}
.side h4{margin:0 0 9px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.side .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.side button{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px}
.side button:hover{border-color:var(--ac)}
.side .wide{flex:1 1 100%;text-align:center}
.side .pri{color:var(--on)}
.dot{width:22px!important;height:22px;min-width:0;padding:0!important;border-radius:50%!important;border:2px solid var(--ln)!important}
.wmp{display:flex;flex-direction:column;gap:10px}
.wmp input[type=text]{padding:7px 9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
.wmp .rg span{min-width:58px;font-size:12px;color:var(--mut)}
.wmp .seg button{flex:1;border:0}
.side select{height:30px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);padding:0 6px}
.side .cg input[type=color],.side input[type=color]{width:34px;height:28px;border:1px solid var(--ln);border-radius:6px;padding:1px;background:none;cursor:pointer}
[hidden]{display:none!important}
/* Theme-reactive soft illuminated falcon */
.logo{position:relative;isolation:isolate;overflow:visible;box-shadow:0 0 10px color-mix(in srgb,var(--ac) 30%,transparent),0 0 22px color-mix(in srgb,var(--ac) 16%,transparent);transition:background .25s,box-shadow .25s}
.logo::before{content:"";position:absolute;inset:-5px;border-radius:13px;background:var(--ac);filter:blur(13px);opacity:.26;z-index:-1;pointer-events:none;animation:none;opacity:.34}
.logo svg{filter:brightness(1.35) drop-shadow(0 0 5px white) drop-shadow(0 0 11px color-mix(in srgb,var(--ac) 40%,white));animation:none;opacity:1}
.hero .wm{opacity:.24;filter:brightness(1.6) drop-shadow(0 0 5px rgba(255,255,255,.95)) drop-shadow(0 0 16px rgba(255,255,255,.65)) drop-shadow(0 0 30px color-mix(in srgb,var(--ac) 50%,white));animation:none;opacity:.48}
@keyframes falconAura{0%,100%{opacity:.20;transform:scale(.96)}50%{opacity:.43;transform:scale(1.10)}}
@keyframes falconShine{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes heroFalconGlow{0%,100%{opacity:.17;filter:drop-shadow(0 0 4px rgba(255,255,255,.4))}50%{opacity:.36;filter:drop-shadow(0 0 12px rgba(255,255,255,.85)) drop-shadow(0 0 25px rgba(255,255,255,.3))}}
@media(max-width:600px){.colors{grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:5px}}
@media(prefers-reduced-motion:reduce){.logo::before,.logo svg,.hero .wm{animation:none}}

/* Floating, blinking spark particles around the falcon */
.hero-sparks{position:absolute;right:0;top:0;width:215px;height:205px;pointer-events:none;z-index:1;overflow:hidden}
.hero-sparks .spark{position:absolute;left:var(--x);top:var(--y);width:var(--sz);height:var(--sz);border-radius:50%;background:#fff;box-shadow:0 0 5px 2px rgba(255,255,255,.8),0 0 13px 3px color-mix(in srgb,var(--ac) 45%,white);opacity:0;animation:sparkFly var(--dur) ease-out var(--delay) infinite}
.hero-sparks .spark:nth-child(3n){background:#ffecab;box-shadow:0 0 6px 2px #ffe4a0,0 0 14px 3px rgba(255,255,255,.6)}
.hero-sparks .spark:nth-child(5n){border-radius:1px;transform:rotate(45deg)}
@keyframes sparkFly{0%{opacity:0;translate:0 5px;scale:.3}12%{opacity:.95;scale:1}40%{opacity:.45}65%{opacity:1}100%{opacity:0;translate:var(--dx) var(--dy);scale:.15}}
.logo-sparks{position:absolute;inset:-8px;pointer-events:none;overflow:visible}
.logo-sparks .spark{position:absolute;left:var(--x);top:var(--y);width:2px;height:2px;border-radius:50%;background:white;box-shadow:0 0 5px 2px white;opacity:0;animation:sparkFly var(--dur) ease-out var(--delay) infinite}
@media(prefers-reduced-motion:reduce){.hero-sparks .spark,.logo-sparks .spark{animation:none;opacity:0}}

/* Refined Numbers-inspired formatting inspector */
.work{grid-template-columns:minmax(0,1fr) 310px;gap:14px}
.side{
  padding:12px;gap:10px;border-radius:18px;
  background:var(--card);border:1px solid var(--ln);
  box-shadow:0 6px 24px rgba(23,20,45,.045);
  scrollbar-width:thin;scrollbar-color:var(--ln) transparent;
}
.side>div,.side>div+div{
  border:1px solid var(--ln);padding:13px 12px;
  border-radius:13px;background:color-mix(in srgb,var(--card) 95%,var(--bg));
}
.side>div+div{border-top:1px solid var(--ln)}
.side h4{
  font-size:11px;letter-spacing:.7px;font-weight:750;
  color:var(--mut);margin:0 0 12px;
  display:flex;align-items:center;gap:7px;
}
.side h4::before{content:"";display:inline-block;width:3px;height:12px;border-radius:5px;background:var(--ac)}
.side .grp{gap:6px}
.side button{transition:background .16s,border-color .16s,box-shadow .16s,transform .16s}
.side button:active{transform:scale(.97)}
.side .ib,.side .grp select{
  height:33px;min-width:34px;border-radius:9px;
}
.side .ib.on,.side [data-al].on{
  background:var(--hd)!important;border-color:var(--ac)!important;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 15%,transparent);
}
.side #fgDots,.side #bgDots{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px 5px;justify-items:center;margin-top:0!important;
  padding:5px 0 9px;
}
.side .dot{
  width:27px!important;height:27px!important;
  border:2px solid var(--card)!important;
  box-shadow:0 0 0 1px var(--ln);
  transition:transform .15s,box-shadow .15s;
}
.side .dot:hover{transform:scale(1.13);box-shadow:0 0 0 2px var(--ac),0 2px 10px color-mix(in srgb,var(--ac) 22%,transparent)}
.side #fgDots+.grp,.side #bgDots+.grp{
  display:grid;grid-template-columns:36px minmax(0,1fr) 34px;
  gap:6px;margin-top:2px!important;
}
.side input[type=color]{
  width:36px;height:33px;border-radius:9px;
}
.side #fFgS,.side #fBgS{
  width:100%;min-width:0;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;font-size:11px;
  background:var(--hd);color:var(--hdt);border-color:var(--ln);
}
.side #fFgX,.side #fBgX{width:34px;font-size:13px}
.side #fMg,.side #fTt{
  min-height:35px;border-radius:9px;font-size:12px;font-weight:650;
}
.side #fTt{box-shadow:0 3px 9px color-mix(in srgb,var(--ac) 17%,transparent)}
.side .wmp{gap:11px}
.side .wmp input[type=text]{
  width:100%;height:36px;border-radius:9px;padding:8px 10px;
  background:var(--bg);font-size:12px;
}
.side .wmp .rg{
  display:grid;grid-template-columns:62px minmax(0,1fr) 42px;gap:8px;
}
.side .wmp .rg span{min-width:0;font-size:11px}
.side .wmp .rg b{min-width:0;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.side .wmp input[type=range]{width:100%;min-width:0;accent-color:var(--ac)}
.side .wmp .seg{
  display:grid;grid-template-columns:1fr 1fr;width:100%;
  padding:3px;border-radius:10px;
}
.side .wmp .seg button{
  padding:7px 4px;min-width:0;font-size:11px;
  border:0;border-radius:8px;white-space:nowrap;
}
.side .wmp .seg button.on{background:var(--card);color:var(--hdt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
@media(max-width:900px){
 .work{grid-template-columns:minmax(0,1fr)}
 .side{max-height:none}
 .side #fgDots,.side #bgDots{grid-template-columns:repeat(10,minmax(0,1fr))}
}
@media(max-width:390px){
 .side #fgDots,.side #bgDots{grid-template-columns:repeat(5,minmax(0,1fr))}
}


/* Top-first formatting workspace */
.work,.work.noside{display:flex;flex-direction:column;gap:9px}
.work .side,.work.noside .side{display:flex!important;order:-1;max-height:none;overflow:visible;width:100%;padding:9px;flex-direction:row;align-items:flex-start;flex-wrap:wrap;gap:8px;border-radius:12px}
.work .main{order:2;min-width:0;width:100%}
.side>div,.side>div+div{border:0;border-right:1px solid var(--ln);border-radius:0;padding:4px 10px;background:transparent;min-width:130px;flex:1 1 170px}
.side>div:last-child{border-right:0;flex:2 1 280px}
.side h4{margin-bottom:7px}
.side #fgDots,.side #bgDots{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 6px}
.side .dot{width:21px!important;height:21px!important}
.side #fgDots+.grp,.side #bgDots+.grp{grid-template-columns:34px minmax(0,1fr) 32px}
.side .wmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.side .wmp>input{grid-column:1/-1}
.side .wmp .rg{grid-template-columns:45px minmax(0,1fr) 34px}
.side .wmp .seg{min-width:0}
#bPan{display:none}
.extra-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.extra-tools button,.extra-tools select{border:1px solid var(--ln);border-radius:8px;padding:7px 10px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit}
.extra-tools button:hover{border-color:var(--ac)}
.extra-tools button.primary{background:var(--ac);color:var(--on);border-color:var(--ac)}
.extra-tools select{max-width:185px}
#tplStatus{font-size:12px;color:var(--mut)}
@media(max-width:750px){.work .side{flex-direction:column}.side>div,.side>div+div{width:100%;flex:auto;border-right:0;border-bottom:1px solid var(--ln)}.side .wmp{grid-template-columns:1fr 1fr}}

/* Compact tabbed formatting ribbon */
#bPan{display:inline-flex!important}
.work .side,.work.noside .side{
 display:flex!important;order:-1;flex-direction:column;align-items:stretch;
 gap:0;padding:0;overflow:visible;border:1px solid var(--ln);
 border-radius:12px;background:var(--card);width:100%;
}
.work.format-closed .side{display:none!important}
.side .format-tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px;background:var(--hd);border-radius:11px 11px 0 0}
.side .format-tab{border:0!important;border-radius:8px!important;background:transparent!important;
 padding:8px 14px!important;font-size:12px!important;font-weight:700!important;color:var(--mut);cursor:pointer}
.side .format-tab.on{background:var(--card)!important;color:var(--hdt)!important;
 box-shadow:0 1px 4px rgba(0,0,0,.10)}
.side>div.format-section,.side>div.format-section+div.format-section{
 display:none!important;border:0!important;border-radius:0!important;
 background:var(--card)!important;padding:11px 13px!important;
 width:100%!important;min-width:0!important;flex:none!important;
}
.side>div.format-section.active{display:flex!important;align-items:center;flex-wrap:wrap;gap:12px}

(function(){
 const side=document.getElementById('side'),work=document.getElementById('work');
 const formatBtn=document.getElementById('bPan');
 if(!side||!work||!formatBtn)return;
 const groups=Array.from(side.children).filter(el=>el.tagName==='DIV');
 const tabs=document.createElement('div');tabs.className='format-tabs';tabs.setAttribute('role','tablist');
 const labels={uz:['Matn','Fon','Katak','Brend yozuvi'],ru:['Текст','Фон','Ячейка','Бренд'],en:['Text','Fill','Cell','Brand']};
 let active=0,opened=false;
 groups.forEach((group,i)=>{
   group.classList.add('format-section');
   if(i>=3)return;
   const b=document.createElement('button');b.type='button';b.className='format-tab';
   b.setAttribute('role','tab');
   b.addEventListener('click',()=>{active=i;opened=true;render()});
   tabs.appendChild(b);
 });
 side.insertBefore(tabs,side.firstChild);
 const brandBtn=document.createElement('button');brandBtn.type='button';brandBtn.id='brandToggle';
 brandBtn.addEventListener('click',()=>{if(opened&&active===3)opened=false;else{active=3;opened=true}render()});
 formatBtn.insertAdjacentElement('afterend',brandBtn);
 function render(){
   const lang=(document.documentElement.lang||'uz').slice(0,2),names=labels[lang]||labels.uz;
   Array.from(tabs.children).forEach((b,i)=>{
     b.textContent=names[i];b.classList.toggle('on',i===active&&opened);
     b.setAttribute('aria-selected',String(i===active&&opened));
   });
   groups.forEach((g,i)=>g.classList.toggle('active',opened&&i===active));
   tabs.hidden=!opened||active===3;
   work.classList.toggle('format-closed',!opened);
   formatBtn.classList.toggle('on',opened&&active!==3);
   brandBtn.classList.toggle('on',opened&&active===3);
   formatBtn.setAttribute('aria-expanded',String(opened&&active!==3));

 document.getElementById('langs')?.addEventListener('click',()=>queueMicrotask(render));
